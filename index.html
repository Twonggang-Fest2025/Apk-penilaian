<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nilai Lembar — Tes OCR V6</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="badge">V6 • TES OCR</div>
    <h1>Nilai Lembar</h1>
    <p>Tes pembacaan tulisan tangan dari foto lembar jawaban.</p>
  </section>

  <section class="card">
    <h2>1. Pilih 1 foto</h2>
    <input id="file" type="file" accept="image/*">
    <div id="previewBox" class="preview hidden">
      <img id="preview" alt="Pratinjau">
    </div>
  </section>

  <section class="card">
    <h2>2. Jalankan OCR</h2>
    <p class="note">Versi ini hanya menguji pembacaan tulisan. Belum menghitung nilai.</p>
    <button id="run" disabled>Mulai Membaca</button>
    <div class="progress"><div id="bar"></div></div>
    <div id="status" class="status">Pilih foto terlebih dahulu.</div>
  </section>

  <section class="card">
    <h2>Hasil OCR</h2>
    <pre id="out">Belum ada hasil.</pre>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
